---
registry_version: "1"
description: "Agent 体系权威索引与配置管理"
last_updated: "2026-04-19"

# 全局默认策略
defaults:
  output_states:
    - Allowed
    - Blocked
    - Uncertain
  default_policy: deny_on_uncertain
  evidence_required: true
  enforcement_levels:
    - L1  # 阻断级，违规直接阻止 CI/PR 合并
    - L2  # 警告级，需人工 Review 或治理产物跟进

# Agent 注册清单
agents:
  # Guardian 层
  - name: architecture-guardian
    file: architecture-guardian.agent
    group: guardian
    status: active
    description: "协调与监督所有 Agent，保证架构约束不被违反"
    priority: 1

  # 核心执行 Agent (Core)
  - name: module-boundary-checker
    file: module-boundary-checker.agent
    group: core
    status: active
    description: "检查模块边界是否被违规访问"
    priority: 2

  - name: handler-pattern-enforcer
    file: handler-pattern-enforcer.agent
    group: core
    status: active
    description: "校验 Handler 模式执行正确性"
    priority: 2

  # 证据生成 Agent (Evidence)
  - name: adr-reviewer
    file: adr-reviewer.agent
    group: evidence
    status: active
    description: "审查 ADR 文档完整性与格式"
    priority: 3

  # 冻结或暂不启用 Agent (Frozen)
  - name: documentation-maintainer
    file: documentation-maintainer.agent
    group: frozen
    status: frozen
    description: "文档维护、链接检查、索引更新"
    priority: 4

  - name: expert-dotnet-software-engineer
    file: expert-dotnet-software-engineer.agent
    group: frozen
    status: frozen
    description: "提供 .NET 技术建议、代码规范检查"
    priority: 4

  - name: test-generator
    file: test-generator.agent
    group: frozen
    status: frozen
    description: "根据 ADR 与约束生成 ArchitectureTests"
    priority: 4

# 分组说明
groups:
  guardian:
    description: "Guardian 层 - 监督协调所有 Agent"
    enforcement_level: L1
  core:
    description: "核心执行 Agent - 直接参与架构约束执行"
    enforcement_level: L1
  evidence:
    description: "证据生成 Agent - 提供分析证据给 Guardian"
    enforcement_level: L2
  frozen:
    description: "冻结或暂不启用 Agent - 不参与自动裁决链，可被 Guardian 显式委托执行"
    enforcement_level: L2

# 触发器说明（GitHub Actions 风格）
supported_triggers:
  - pull_request      # PR 创建或更新
  - push              # 代码推送到分支
  - workflow_dispatch # 手动触发
  - schedule          # 定时任务
  - merge_group       # 合并队列
  - manual_review     # 人工审查触发
  - agent_delegation  # Agent 委托触发

# ADR 依赖关系
adr_dependencies:
  - ADR-007   # Agent 行为与权限宪法
  - ADR-007-A # ADR-007 对齐执行标准
  - ADR-900   # 架构测试与 CI 治理元规则
  - ADR-907   # ArchitectureTests 执法治理体系
  - ADR-907-A # ADR-907 对齐执行标准

# Schema 说明（内联文档）
schema:
  description: "Agent 配置文件格式规范"
  required_fields:
    - schema_version
    - name
    - version
    - type
    - status
    - risk_level
    - enforcement_level
    - triggers
    - reports_to
    - delegation_to
    - governance
    - capabilities
    - responsibilities
    - prohibitions
    - evidence_contract
  conventions:
    - "所有治理 agent 文件使用 .agent 扩展名（YAML 格式）"
    - "VS Code Copilot 聊天 agent 文件使用 .agent.md 扩展名（Markdown 格式）"
    - "delegation_to 必须为数组，无委托使用 []"
    - "status: frozen 的 agent 必须 triggers: []"
    - "triggers 使用 snake_case 风格"
    - "所有 YAML 必须可被 yaml.safe_load() 解析"

# VS Code Copilot 聊天 Agents（来自 Awesome Copilot Plugin）
# 注意：以下 agents 为 .agent.md 格式，供 VS Code Copilot Chat 使用
# 与上方 YAML 格式的治理 agents 相互补充，不相互冲突
# 来源：https://github.com/github/awesome-copilot
vscode_copilot_agents:
  - name: CSharpExpert
    file: CSharpExpert.agent.md
    source: awesome-copilot
    description: "C#/.NET 专家助手，提供最佳实践、代码审查和设计建议"
    relevance: "项目使用 .NET 10 + C#，此 Agent 直接相关"

  - name: csharp-dotnet-janitor
    file: csharp-dotnet-janitor.agent.md
    source: awesome-copilot
    description: "C#/.NET 代码清理与现代化，消除技术债务"
    relevance: "维护代码质量，升级到最新 C# 语言特性"

  - name: postgresql-dba
    file: postgresql-dba.agent.md
    source: awesome-copilot
    description: "PostgreSQL 数据库管理，查询优化，性能分析"
    relevance: "项目使用 PostgreSQL + Marten，此 Agent 直接相关"

  - name: github-actions-expert
    file: github-actions-expert.agent.md
    source: awesome-copilot
    description: "GitHub Actions CI/CD 专家，安全流水线设计"
    relevance: "项目有多个 GitHub Actions 工作流，此 Agent 直接相关"

  - name: debug
    file: debug.agent.md
    source: awesome-copilot
    description: "系统化调试模式，定位和修复 Bug"
    relevance: "通用调试助手，适用于所有场景"

  - name: meta-agentic-project-scaffold
    file: meta-agentic-project-scaffold.agent.md
    source: awesome-copilot-plugin
    description: "从 awesome-copilot 仓库发现并安装相关工具"
    relevance: "Awesome Copilot Plugin 核心 Agent，用于工具管理"
