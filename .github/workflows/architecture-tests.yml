name: Architecture Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: write

jobs:
  architecture-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.*' # 推荐使用通配符，提升兼容性

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Validate ADR Consistency (Architecture Tests)
        run: |
          echo "::group::ADR 编号/目录/内容一致性验证（架构测试）"
          dotnet test src/tests/ArchitectureTests/ArchitectureTests.csproj \
            --filter "FullyQualifiedName~AdrConsistencyTests" \
            --logger "console;verbosity=normal" \
            --configuration Release
          echo "::endgroup::"

#      - name: Validate Three-Way Mapping
#        run: |
#          echo "::group::ADR/测试/Prompt 三位一体映射验证"
#          chmod +x ./scripts/validate-three-way-mapping.sh
#          ./scripts/validate-three-way-mapping.sh
#          echo "::endgroup::"

#      - name: Validate ADR-Test Mapping (Architecture Tests)
#        run: |
#          echo "::group::ADR-测试映射一致性验证（架构测试）"
#          dotnet test src/tests/ArchitectureTests/ArchitectureTests.csproj \
#            --filter "FullyQualifiedName~AdrTestMappingTests" \
#            --logger "console;verbosity=normal" \
#            --configuration Release
#          echo "::endgroup::"

      - name: Run architecture tests
        run: |
          echo "::group::Architecture Tests Execution"
          dotnet test src/tests/ArchitectureTests \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=architecture-test-results.trx" \
            --logger "console;verbosity=detailed" \
            --collect:"XPlat Code Coverage"
          echo "::endgroup::"
        env:
          Configuration: Release

#      - name: Generate test report
#        if: always() && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
#        uses: dorny/test-reporter@v1
#        with:
#          name: Architecture Tests Report
#          path: '**/architecture-test-results.trx'
#          reporter: dotnet-trx
#          fail-on-error: true
#        timeout-minutes: 5 # 增加超时限制，防止卡死

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-test-results
          path: |
            **/architecture-test-results.trx
            **/TestResults/

      - name: Check architecture compliance
        if: failure()
        run: |
          echo "::group::❌ Architecture Tests Failed"
          echo ""
          echo "⚠️ 架构测试失败检测到违规行为"
          echo ""
          echo "📋 如何使用 Copilot 诊断和修复："
          echo ""
          echo "1️⃣ 查看详细的测试失败日志（在上方 'Run architecture tests' 步骤中）"
          echo ""
          echo "2️⃣ 将失败日志复制给 GitHub Copilot，并询问："
          echo "   \"请根据以下架构测试失败日志，解释违规原因并提供修复建议\""
          echo ""
          echo "3️⃣ Copilot 会参考以下资源提供解释："
          echo "   - docs/copilot/README.md - Copilot 角色定位"
          echo "   - docs/copilot/adr-XXXX.prompts.md - 各 ADR 的提示词库"
          echo "   - docs/copilot/architecture-test-failures.md - 失败解释指南"
          echo ""
          echo "4️⃣ 根据 Copilot 的建议修复代码"
          echo ""
          echo "5️⃣ 本地验证修复："
          echo "   dotnet test src/tests/ArchitectureTests/"
          echo ""
          echo "📚 相关资源："
          echo "   - Copilot 治理体系：https://github.com/${{ github.repository }}/blob/main/docs/copilot/README.md"
          echo "   - 架构测试失败指南：https://github.com/${{ github.repository }}/blob/main/docs/copilot/architecture-test-failures.md"
          echo "   - PR 模板：https://github.com/${{ github.repository }}/blob/main/.github/PULL_REQUEST_TEMPLATE.md"
          echo "   - 下载测试报告：https://github.com/${{ github.repository }}/actions/artifacts"
          echo ""
          echo "::endgroup::"
          exit 1

      - name: Comment on PR with Copilot guidance
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const comment = `## ❌ 架构测试失败\n\n⚠️ 本 PR 的架构测试未通过，检测到架构违规行为。\n\n### 📋 使用 Copilot 诊断和修复\n\n#### 1️⃣ 查看失败日志\n点击上方 \"Run architecture tests\" 步骤查看详细的失败信息。\n\n#### 2️⃣ 询问 Copilot\n将失败日志复制给 GitHub Copilot，并询问：\n\n\`\`\`\n请根据以下架构测试失败日志，解释违规原因并提供修复建议\n\n[粘贴失败日志]\n\`\`\`\n\n#### 3️⃣ Copilot 参考资源\nCopilot 会基于以下资源为你提供详细解释：\n- [Copilot 治理体系](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/copilot/README.md)\n- [ADR 提示词库](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/main/docs/copilot)\n- [架构测试失败解释指南](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/copilot/architecture-test-failures.md)\n\n#### 4️⃣ 修复并验证\n根据 Copilot 的建议修复代码后，在本地运行：\n\n\`\`\`bash\ndotnet test src/tests/ArchitectureTests/\n\`\`\`\n\n### 📚 相关 ADR\n\n- [ADR-001: 模块化单体与垂直切片架构](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/adr/constitutional/ADR-001-modular-monolith-vertical-slice-architecture.md)\n- [ADR-002: Platform / Application / Host 三层启动体系](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/adr/constitutional/ADR-002-platform-application-host-bootstrap.md)\n- [ADR-003: 命名空间与项目边界规范](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/adr/constitutional/ADR-003-namespace-rules.md)\n- [ADR-004: 中央包管理（CPM）规范](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/adr/constitutional/ADR-004-Cpm-Final.md)\n- [ADR-005: 应用内交互模型与执行边界](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/adr/constitutional/ADR-005-Application-Interaction-Model-Final.md)\n\n---\n\n💡 **提示**：记得在 PR 描述中完成 \"Copilot 参与检查清单\"。\n`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('PR 评论失败:', error);
            }

      - name: Architecture compliance summary
        if: success()
        run: |
          echo "::group::✅ Architecture Compliance Summary"
          echo ""
          echo "🎉 所有架构测试通过！"
          echo ""
          echo "✅ 本 PR 符合以下架构决策记录（ADR）："
          echo "   - ADR-001: 模块化单体与垂直切片架构"
          echo "   - ADR-002: Platform / Application / Host 三层启动体系"
          echo "   - ADR-003: 命名空间与项目边界规范"
          echo "   - ADR-004: 中央包管理（CPM）规范"
          echo "   - ADR-005: 应用内交互模型与执行边界"
          echo ""
          echo "💡 提示：在 PR 中勾选 'Copilot 参与检查清单'"
          echo ""
          echo "::endgroup::"
